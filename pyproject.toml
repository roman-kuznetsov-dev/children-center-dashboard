[tool.ruff]
line-length = 120
target-version = "py312"

exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg",
    ".mypy_cache", ".pytest_cache", ".ruff_cache",
    ".venv", "venv", "__pycache__",
    "build", "dist",
    "node_modules",
    "*/migrations/*.py",
    "frontend",
]

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]

ignore = [
    "E501",   # line too long (у нас line-length=120)
    "E402",   # module level import not at top (нужно для Django-скриптов)
    "RUF012", # mutable class attributes (Django/DRF сами так работают)
    "FURB162", # timezone.replace('Z', '+00:00') — ложное срабатывание
    "DJ012", # порядок эелементов в модели - слишком строгое правило
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "backend/asgi.py",
    "backend/wsgi.py",
    "backend/auto_test.py",
    "backend/generate_real_data.py",
    "backend/simulate_ofd.py",
    "backend/manual_webhook_test.py",
    "manage.py",
    "venv/*",
    "frontend/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false